[project]
name = "text-as-data"
version = "0.1.0"
description = "Pipeline to turn unstructured text into a structured table via LLM classification against an explicit codebook, validated against human coding."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "instructor>=1.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "anthropic>=0.34",
    "openai>=1.30",
    "tenacity>=8.2",
    "ftfy>=6.2",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "platformdirs>=4.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
decifra = "text_as_data.cli:main"

[tool.setuptools.package-data]
text_as_data = ["static/**/*", "static/*"]
