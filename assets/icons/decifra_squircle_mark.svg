<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>Decifra Brand Mark</title>
  <style>
    :root {
      --bg: #09090B;
      --fg: #FFFFFF;
      --border: rgba(0, 0, 0, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181B;
        --fg: #FAFAFA;
        --border: rgba(255, 255, 255, 0.18);
      }
    }
  </style>
  <!-- Rosetta Chamfered Monolith (Squircle with 45-degree top-right chamfer) -->
  <path d="M 14 8 C 10.7 8 8 10.7 8 14 L 8 50 C 8 53.3 10.7 56 14 56 L 50 56 C 53.3 56 56 53.3 56 50 L 56 24 L 40 8 Z" 
        fill="var(--bg)" stroke="var(--border)" stroke-width="1.2"/>
  <!-- Negative Space: Thoth Sacred Ibis Beak Arc -->
  <path d="M 22 28 C 26 20 34 18 40 22 C 34 22 28 26 22 28 Z" fill="var(--fg)"/>
  <path d="M 38 21 C 28 22 20 30 16 38 C 22 34 30 30 36 26 Z" fill="var(--fg)"/>
  <!-- Structured Tabular Data Registers -->
  <rect x="20" y="42" width="24" height="3" rx="1.5" fill="var(--fg)"/>
  <rect x="20" y="48" width="16" height="3" rx="1.5" fill="var(--fg)" opacity="0.75"/>
</svg>
