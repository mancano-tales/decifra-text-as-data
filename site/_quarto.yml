project:
  type: website
  render:
    - index.qmd
    - how-it-works.qmd
    - architecture.qmd
    - validation.qmd

execute:
  freeze: auto

website:
  title: "Decifra"
  description: "A local-first tool that turns your codebook and a text corpus into a structured, LLM-coded table — validated against human coding, not trusted on faith."
  site-url: https://mancano-tales.github.io/decifra-text-as-data/

  repo-url: https://github.com/mancano-tales/decifra-text-as-data
  repo-actions: [source, issue]

  page-navigation: true
  reader-mode: true
  back-to-top-navigation: true

  navbar:
    background: dark
    left:
      - text: Overview
        href: index.qmd
      - text: How It Works
        href: how-it-works.qmd
      - text: Architecture
        href: architecture.qmd
      - text: Why Validation
        href: validation.qmd
    right:
      - icon: github
        href: https://github.com/mancano-tales/decifra-text-as-data
        target: _blank
      - text: "← Main Site"
        href: https://mancano-tales.github.io
        target: _blank

  sidebar:
    - title: "Decifra"
      style: docked
      contents:
        - text: Overview
          href: index.qmd
        - text: How It Works
          href: how-it-works.qmd
        - text: Architecture
          href: architecture.qmd
        - text: Why Validation Matters
          href: validation.qmd

  page-footer:
    left: |
      © 2026 [Tales Mançano](https://mancano-tales.github.io) · MA Political Science, University of São Paulo
    center: |
      Built with [Quarto](https://quarto.org)
    right:
      - icon: github
        href: https://github.com/mancano-tales/decifra-text-as-data
        target: _blank

  open-graph: true

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    footnotes-hover: true
    link-external-icon: true
    link-external-newwindow: true
